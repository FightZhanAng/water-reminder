name: Release

# 推一个 v* 的 tag 就会在 GitHub 的机器上重新构建并发布 Release。
#
# 为什么不是本地打完包再上传：这台开发机除了 git 自己的 libcurl 之外，
# 所有到 GitHub 的 HTTPS 通道（curl / Node fetch）都被证书吊销检查挡住了，
# 而 GitHub 的 Release 资产只能走 HTTP 上传，SSH 管不了。
# 交给 Actions 反而更省事，顺带保证了「Release 里的包一定能从源码重现」。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest

    # 放在 job 级别，保证 gh 那条命令一定拿得到。
    # github.token 和 secrets.GITHUB_TOKEN 是同一个值，用前者更直白。
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 不用 --frozen-lockfile：本地环境无法重新生成 lock，
      # 万一有细微不一致，宁可让 CI 自己解析也不要卡住发布
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 核心逻辑测试
        run: pnpm test:core

      - name: 重新生成图标
        run: pnpm gen:icons

      # --publish never 是必须的（已写进 package.json 的 dist 脚本）：
      # 在 CI 里推 tag 会触发 electron-builder 的「隐式发布」，
      # 它会抢在下面那步之前自己去发 Release 并因缺少凭据而失败，
      # 连累整个 dist 步骤退出码 1。发布会由下面的 gh 命令负责。
      - name: 打包
        run: pnpm dist
        env:
          # CI 直连 GitHub 官方源，不用国内镜像
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: 留档构建产物
        uses: actions/upload-artifact@v4
        with:
          name: water-reminder-${{ github.ref_name }}
          path: |
            release/*-setup.exe
            release/*-portable.exe
          if-no-files-found: error

      # 写成幂等的：重跑同一个 tag 时不会因为 Release 已存在而再失败一次
      - name: 创建 Release 并挂上安装包
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            release/water-reminder-*-setup.exe \
            release/water-reminder-*-portable.exe \
            --clobber
