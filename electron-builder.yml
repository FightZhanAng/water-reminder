appId: com.tomcato.water-reminder
productName: 喝水提醒
copyright: Copyright © 2026 tomcato

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources
    to: assets
    filter:
      - '**/*'

win:
  # 用自己生成的多尺寸 .ico，不要给它 png 让它去转 ——
  # electron-builder 内置的 WASM 图标工具在内存受限环境下会直接崩掉打包流程
  icon: resources/icon.ico
  # 可执行文件名保持 ASCII：产品名带中文时，中文 exe 名在部分工具链和
  # 快捷方式解析上会出问题，显示名交给 productName 就够了
  executableName: water-reminder
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 喝水提醒
  artifactName: water-reminder-${version}-setup.${ext}

portable:
  artifactName: water-reminder-${version}-portable.${ext}

mac:
  # 未签名：没有 Apple Developer ID。identity: null 是 electron-builder 文档明示的
  # 「跳过签名」开关，不设它 CI 上会去钥匙串里找签名身份然后整个 job 失败。
  # 代价是首次打开要过 Gatekeeper，README 的「macOS 包是未签名的」一节写了绕法
  identity: null
  # 上面 win 注释里那颗 WASM 坑同样适用于 icns 转换 —— 由 scripts/gen-icons.mjs 直出
  icon: resources/icon.icns
  category: public.app-category.healthcare-fitness
  # 文件名保持 ASCII（productName 是中文，别让它进 dmg 文件名）；
  # arm64 覆盖 Apple Silicon、x64 覆盖 Intel。CI 的 macos-latest 是 arm 机器，
  # 但打包纯 JS 应用不涉及本机编译，x64 照常出
  artifactName: water-reminder-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
