<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>喝水提醒</title>
  </head>
  <body>
    <!--
      静态兜底文案。React 挂载后会替换掉它。
      留着这行的意义：前端脚本要是没启动，界面上至少还有字，
      而不是一片空白让人误以为是窗口/渲染的问题。
      样式走 .boot，这样深浅两套主题下都看得清。
    -->
    <div id="root">
      <div class="boot">
        正在加载界面…<br />
        <span class="boot-hint">如果这行字一直不变，说明前端脚本没能启动。</span>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
